    <path d="M84 0v560M168 0v560M252 0v560M336 0v560M420 0v560M504 0v560M588 0v560M672 0v560M756 0v560M840 0v560M924 0v560M1008 0v560M1092 0v560"/>
  </g>

  <g transform="translate(64 64)">
