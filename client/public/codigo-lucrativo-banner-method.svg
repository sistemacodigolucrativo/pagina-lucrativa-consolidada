        <path d="M11 34l13-13 10 8 17-19"/>
        <text x="31" y="88" text-anchor="middle" fill="#dfffee" stroke="none" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800">MÉTODO</text>
      </g>
      <g transform="translate(126 0)">
        <circle cx="31" cy="23" r="24"/>
        <path d="M19 24h24M31 12v24"/>
        <text x="31" y="88" text-anchor="middle" fill="#dfffee" stroke="none" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800">ESTRUTURA</text>
