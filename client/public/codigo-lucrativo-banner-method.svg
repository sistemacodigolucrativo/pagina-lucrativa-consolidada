    <text x="52" y="120" fill="#36ff9b" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="900">Lucrativo</text>
    <rect x="52" y="154" width="166" height="54" rx="12" fill="#08291c" stroke="#1bd982"/>
    <text x="68" y="188" fill="#caffdf" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800">Método ativo</text>
    <g fill="#0d2d20" stroke="#1bd982">
