<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Método Código Lucrativo pronto para começar</title>
  <desc id="desc">Banner comercial do Método Código Lucrativo com estrutura consolidada, Escritório Virtual, ferramentas e treinamentos.</desc>
  <defs>
    <radialGradient id="glow" cx="78%" cy="48%" r="55%">
      <stop offset="0%" stop-color="#28f58f" stop-opacity="0.52"/>
      <stop offset="45%" stop-color="#063f2a" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#020807" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="titleGradient" x1="0%" x2="100%" y1="0%" y2="0%">
      <stop offset="0%" stop-color="#caffdf"/>
      <stop offset="48%" stop-color="#34ff9d"/>
      <stop offset="100%" stop-color="#0bbf71"/>
    </linearGradient>
    <linearGradient id="panel" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#081913"/>
      <stop offset="100%" stop-color="#02100c"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="560" rx="38" fill="#030706"/>
  <rect width="1200" height="560" rx="38" fill="url(#glow)"/>
  <g opacity="0.17" stroke="#35ff9e" stroke-width="1">
