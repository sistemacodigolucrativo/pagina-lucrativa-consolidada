    <text x="183" y="269" fill="#dcffee" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800">LINKS</text>
    <text x="87" y="349" fill="#dcffee" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800">CURSOS</text>
    <text x="183" y="349" fill="#dcffee" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800">PEDIDOS</text>
