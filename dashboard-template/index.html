<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Template - Código Lucrativo</title>
    <link rel="stylesheet" href="./styles.css?v=11" />
  </head>
  <body>
    <main class="template-shell" aria-label="Template isolado do dashboard Código Lucrativo">
      <section class="dashboard-frame">
        <header class="topbar">
          <a class="brand" href="#" aria-label="Código Lucrativo">
            <span class="brand-logo-wrap">
              <img src="./codigo-lucrativo-logo.png?v=3" alt="Código Lucrativo" />
            </span>
          </a>
          <div class="top-actions">
            <button class="icon-button" type="button" aria-label="Notificações">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9" /><path d="M13.7 21a2 2 0 0 1-3.4 0" /></svg>
              <span class="alert-dot" aria-hidden="true"></span>
            </button>
            <button class="icon-button fullscreen-button" type="button" aria-label="Tela cheia">
              <svg class="fullscreen-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3" /><path d="M16 3h3a2 2 0 0 1 2 2v3" /><path d="M21 16v3a2 2 0 0 1-2 2h-3" /><path d="M8 21H5a2 2 0 0 1-2-2v-3" /></svg>
              <svg class="fullscreen-close" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3v3a2 2 0 0 1-2 2H3" /><path d="M16 3v3a2 2 0 0 0 2 2h3" /><path d="M21 16h-3a2 2 0 0 0-2 2v3" /><path d="M3 16h3a2 2 0 0 1 2 2v3" /></svg>
            </button>
            <button class="icon-button" type="button" aria-label="Abrir menu">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16" /><path d="M4 12h16" /><path d="M4 17h16" /></svg>
            </button>
          </div>
        </header>

        <section class="user-panel" aria-label="Usuário">
          <div class="avatar" aria-hidden="true">
            <span></span>
          </div>
          <div>
            <p>Olá, Marcelo</p>
            <span>Bem-vindo ao seu escritório</span>
          </div>
        </section>

        <section class="metrics-grid" aria-label="Métricas principais">
          <article class="metric-card metric-card-strong">
            <div class="metric-head">
              <span>Ganhos</span>
              <svg class="metric-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v20" /><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7H14a3.5 3.5 0 0 1 0 7H6" /></svg>
            </div>
            <strong>R$ 7.892,45</strong>
            <small>Este mês</small>
            <svg class="sparkline" viewBox="0 0 150 42" preserveAspectRatio="none" aria-hidden="true">
              <path class="spark-area" d="M0 34 L18 30 L37 31 L55 21 L74 25 L93 14 L112 18 L132 8 L150 11 L150 42 L0 42 Z" />
              <path class="spark-stroke" d="M0 34 L18 30 L37 31 L55 21 L74 25 L93 14 L112 18 L132 8 L150 11" />
            </svg>
          </article>

          <article class="metric-card">
            <div class="metric-head">
              <span>Pedidos</span>
              <svg class="metric-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6h15l-1.5 9h-12z" /><path d="M6 6 5 3H2" /><circle cx="9" cy="20" r="1.6" /><circle cx="18" cy="20" r="1.6" /></svg>
            </div>
            <strong>128</strong>
            <small>Este mês</small>
            <svg class="sparkline" viewBox="0 0 150 42" preserveAspectRatio="none" aria-hidden="true">
              <path class="spark-area alt" d="M0 30 L18 32 L36 23 L54 26 L72 17 L90 21 L108 12 L126 14 L150 7 L150 42 L0 42 Z" />
              <path class="spark-stroke alt" d="M0 30 L18 32 L36 23 L54 26 L72 17 L90 21 L108 12 L126 14 L150 7" />
            </svg>
          </article>
        </section>

        <section class="shortcut-grid" aria-label="Funcionalidades">
          <button class="shortcut" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v14H4z" /><path d="M8 8h8" /><path d="M8 12h5" /></svg>
            <span>Minha Página</span>
          </button>
          <button class="shortcut" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 8h14l-2 9H8z" /><path d="M7 8 6 4H3" /><circle cx="10" cy="21" r="1.5" /><circle cx="18" cy="21" r="1.5" /></svg>
            <span>Meus Pedidos</span>
          </button>
          <button class="shortcut" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5" /><path d="M4 19h16" /><path d="m8 15 3-4 3 2 5-7" /></svg>
            <span>Campanhas</span>
          </button>
          <button class="shortcut" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14.7 6.3 3 3" /><path d="m3 21 5.6-1.5L20.4 7.7a2.1 2.1 0 0 0-3-3L5.6 16.5z" /></svg>
            <span>Ferramentas</span>
          </button>
          <button class="shortcut" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h7l4 4v14H7z" /><path d="M14 3v5h5" /><path d="M10 13h6" /><path d="M10 17h4" /></svg>
            <span>Materiais</span>
          </button>
          <button class="shortcut" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" /><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2" /></svg>
            <span>Academia</span>
          </button>
          <button class="shortcut" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 11a4 4 0 1 0-8 0" /><path d="M4 21a8 8 0 0 1 16 0" /><path d="M19 8v6" /><path d="M22 11h-6" /></svg>
            <span>Contatos</span>
          </button>
          <button class="shortcut" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" /><circle cx="9" cy="7" r="4" /><path d="M22 21v-2a4 4 0 0 0-3-3.87" /><path d="M16 3.13a4 4 0 0 1 0 7.75" /></svg>
            <span>Indicados</span>
          </button>
          <button class="shortcut" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v16H4z" /><path d="M8 9h8" /><path d="M8 13h8" /><path d="M8 17h5" /></svg>
            <span>Extrato</span>
          </button>
        </section>

        <button class="journey-card" type="button">
          <span class="journey-icon">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v5" /><path d="m19 5-3.5 3.5" /><path d="M22 12h-5" /><path d="m19 19-3.5-3.5" /><path d="M12 22v-5" /><path d="m5 19 3.5-3.5" /><path d="M2 12h5" /><path d="M5 5l3.5 3.5" /></svg>
          </span>
          <span class="journey-copy">
            <strong>Jornada do Iniciante</strong>
            <small>Comece por aqui e dê os primeiros passos</small>
          </span>
          <span class="journey-arrow" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M5 12h14" /><path d="m13 6 6 6-6 6" /></svg>
          </span>
        </button>
      </section>
    </main>
    <div class="toast" role="status" aria-live="polite"></div>
    <script src="./app.js?v=11"></script>
  </body>
</html>
