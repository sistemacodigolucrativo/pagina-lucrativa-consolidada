name: Aplicar anotações administrativas revisadas

on:
  push:
    branches: [feat-admin-content-ebooks-testimonials]
    paths:
      - .github/workflows/apply-admin-content-annotations.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat-admin-content-ebooks-testimonials
          fetch-depth: 0
      - name: Aplicar alterações cirúrgicas
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Trecho não encontrado em {path}: {old[:120]!r}")
              text = text.replace(old, new, 1)
              p.write_text(text)

          pub = "client/src/pages/AdminPublications.tsx"
          replace_once(pub,
              'const missingGoogleDriveUrlMessage = "Informe o link do Google Drive antes de publicar o recurso.";\n',
              'const missingGoogleDriveUrlMessage = "Informe o link do Google Drive antes de publicar o recurso.";\nconst SYSTEM_CONTENT_CATEGORIES = new Set(["public-sales-copy", "public-sales-layout", "member-admin-control", "public-toast-config"]);\n')
          replace_once(pub,
              '  const managedItems = useMemo(() => (content.data ?? []).filter(item => item.kind === config.kind), [content.data, config.kind]);',
              '  const managedItems = useMemo(() => (content.data ?? []).filter(item => item.kind === config.kind && (config.kind !== "notice" || !SYSTEM_CONTENT_CATEGORIES.has(item.resourceCategory ?? ""))), [content.data, config.kind]);')
          replace_once(pub,
              '<main className="mx-auto w-full max-w-7xl space-y-7 p-5 sm:p-8">',
              '<main className="mx-auto w-full max-w-7xl space-y-7 p-4 sm:p-6 lg:p-8">')
          replace_once(pub,
              '<section className="grid gap-6 xl:grid-cols-[minmax(0,0.9fr)_minmax(0,1.1fr)]">',
              '<section className="grid min-w-0 gap-6 xl:grid-cols-[minmax(0,0.9fr)_minmax(0,1.1fr)]">')
          replace_once(pub,
              '<form onSubmit={submit} className="space-y-4 rounded-2xl border border-white/10 bg-zinc-950/60 p-5">',
              '<form onSubmit={submit} className="min-w-0 space-y-4 rounded-2xl border border-white/10 bg-zinc-950/60 p-4 sm:p-5">')
          replace_once(pub,
              '<section className="rounded-2xl border border-white/10 bg-zinc-950/60 p-5"><div className="mb-4 flex items-center justify-between">',
              '<section className="min-w-0 rounded-2xl border border-white/10 bg-zinc-950/60 p-4 sm:p-5"><div className="mb-4 flex flex-col items-start gap-1 sm:flex-row sm:items-center sm:justify-between">')
          replace_once(pub,
              '<div className="flex flex-wrap items-start justify-between gap-3"><div><span className="text-xs uppercase tracking-wider text-emerald-200">',
              '<div className="flex min-w-0 flex-col gap-3 sm:flex-row sm:items-start sm:justify-between"><div className="min-w-0 flex-1"><span className="text-xs uppercase tracking-wider text-emerald-200">')
          replace_once(pub,
              '<h3 className="mt-1 font-medium text-white">{item.title}</h3><p className="mt-1 line-clamp-2 text-sm text-zinc-400">',
              '<h3 className="mt-1 font-medium text-white [overflow-wrap:anywhere]">{item.title}</h3><p className="mt-1 line-clamp-2 text-sm text-zinc-400 [overflow-wrap:anywhere]">')
          replace_once(pub,
              '<div className="flex flex-wrap gap-2"><button type="button" onClick={() => edit(item)} className="inline-flex items-center gap-1 rounded-lg border border-white/15 px-3 py-2 text-sm text-zinc-200"><PencilLine className="size-4" />Editar</button><button type="button" disabled={deletingId === item.id} onClick={() => void removeItem(item)} className="inline-flex items-center gap-1 rounded-lg border border-red-400/25 px-3 py-2 text-sm text-red-200 disabled:opacity-60">',
              '<div className="grid w-full grid-cols-2 gap-2 sm:w-auto sm:flex"><button type="button" onClick={() => edit(item)} className="inline-flex w-full items-center justify-center gap-1 rounded-lg border border-white/15 px-3 py-2 text-sm text-zinc-200 sm:w-auto"><PencilLine className="size-4" />Editar</button><button type="button" disabled={deletingId === item.id} onClick={() => void removeItem(item)} className="inline-flex w-full items-center justify-center gap-1 rounded-lg border border-red-400/25 px-3 py-2 text-sm text-red-200 disabled:opacity-60 sm:w-auto">')

          ebooks = "client/src/pages/AdminEbooks.tsx"
          replace_once(ebooks,
              '  const [form, setForm] = useState<EbookForm>(() => newForm(defaultUsage));\n',
              '  const [form, setForm] = useState<EbookForm>(() => newForm(defaultUsage));\n  const [formOpen, setFormOpen] = useState(() => !isLibraryAdmin);\n')
          replace_once(ebooks,
              '  useEffect(() => {\n    if (selectedId !== null) return;\n    setForm(current => (current.usage === defaultUsage ? current : newForm(defaultUsage)));\n  }, [defaultUsage, selectedId]);',
              '  useEffect(() => {\n    if (selectedId !== null) return;\n    setForm(current => (current.usage === defaultUsage ? current : newForm(defaultUsage)));\n    setFormOpen(!isLibraryAdmin);\n  }, [defaultUsage, isLibraryAdmin, selectedId]);')
          replace_once(ebooks,
              '      setForm(newForm(defaultUsage));\n      toast.success(isLibraryAdmin ? "E-book criado." : "Material da Academia criado.");',
              '      setSelectedId(null);\n      setForm(newForm(defaultUsage));\n      if (isLibraryAdmin) setFormOpen(false);\n      toast.success(isLibraryAdmin ? "E-book criado." : "Material da Academia criado.");')
          replace_once(ebooks,
              '  const resetForm = () => {\n    setSelectedId(null);\n    setForm(newForm(defaultUsage));\n  };',
              '  const closeForm = () => {\n    setSelectedId(null);\n    setForm(newForm(defaultUsage));\n    if (isLibraryAdmin) setFormOpen(false);\n  };\n\n  const openNewForm = () => {\n    setSelectedId(null);\n    setForm(newForm(defaultUsage));\n    setFormOpen(true);\n  };\n\n  const openExisting = (id: number) => {\n    setSelectedId(id);\n    setFormOpen(true);\n  };')
          replace_once(ebooks,
              '<header className="space-y-2">',
              '<header className={isLibraryAdmin ? "space-y-2 rounded-2xl border border-white/10 bg-zinc-950/60 p-4 sm:p-5" : "space-y-2"}>')
          replace_once(ebooks,
              '<section className="grid gap-5 lg:grid-cols-[minmax(0,0.9fr)_minmax(0,1.35fr)] lg:items-start">',
              '<section className={isLibraryAdmin ? "grid gap-5" : "grid gap-5 lg:grid-cols-[minmax(0,0.9fr)_minmax(0,1.35fr)] lg:items-start"}>')
          replace_once(ebooks,
              '<aside className="order-2 rounded-2xl border border-white/10 bg-zinc-950/60 p-3 lg:order-1">',
              '<aside className={isLibraryAdmin ? "order-2 rounded-2xl border border-white/10 bg-zinc-950/60 p-3" : "order-2 rounded-2xl border border-white/10 bg-zinc-950/60 p-3 lg:order-1"}>')
          replace_once(ebooks,
              'onClick={resetForm} className="inline-flex items-center justify-center gap-2 rounded-xl bg-emerald-300',
              'onClick={openNewForm} className="inline-flex items-center justify-center gap-2 rounded-xl bg-emerald-300')
          text = Path(ebooks).read_text()
          text = text.replace('onClick={() => setSelectedId(ebook.id)}', 'onClick={() => openExisting(ebook.id)}')
          Path(ebooks).write_text(text)
          replace_once(ebooks,
              '<div className="order-1 space-y-5 lg:order-2">',
              '<div className={isLibraryAdmin ? "contents" : "order-1 space-y-5 lg:order-2"}>')
          replace_once(ebooks,
              '<form onSubmit={submit} className="space-y-5 rounded-2xl border border-white/10 bg-zinc-950/60 p-4 sm:p-5">',
              '{(!isLibraryAdmin || formOpen) ? <form onSubmit={submit} className={`${isLibraryAdmin ? "order-3 " : ""}space-y-5 rounded-2xl border border-white/10 bg-zinc-950/60 p-4 sm:p-5`}>')
          replace_once(ebooks,
              '                {selectedId && (\n                  <button type="button" onClick={resetForm}',
              '                {(selectedId || (isLibraryAdmin && formOpen)) && (\n                  <button type="button" onClick={closeForm}')
          replace_once(ebooks,
              '                    Fechar edição\n',
              '                    {selectedId ? "Fechar edição" : "Fechar formulário"}\n')
          replace_once(ebooks,
              '            </form>\n\n            <section className="rounded-2xl border border-white/10 bg-zinc-950/60 p-4 sm:p-5">',
              '            </form> : null}\n\n            <section className={isLibraryAdmin ? "order-1 rounded-2xl border border-white/10 bg-zinc-950/60 p-4 sm:p-5" : "rounded-2xl border border-white/10 bg-zinc-950/60 p-4 sm:p-5"}>')

          testimonials = "client/src/pages/AdminTestimonials.tsx"
          replace_once(testimonials,
              'onClick={() => setFilter(status)} className={`rounded-2xl border p-4 text-left',
              'onClick={() => setFilter(status)} aria-pressed={filter === status} aria-controls="testimonial-moderation-list" className={`rounded-2xl border p-4 text-left')
          replace_once(testimonials,
              '<section className="rounded-2xl border border-white/10 bg-zinc-950/60 p-5 sm:p-6">',
              '<section id="testimonial-moderation-list" className="rounded-2xl border border-white/10 bg-zinc-950/60 p-5 sm:p-6">')
          PY
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ativar pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.4.1 --activate
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm check
      - name: Testes
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Commitar implementação validada
        shell: bash
        run: |
          git config user.name "sistemacodigolucrativo"
          git config user.email "sistemacodigolucrativo@gmail.com"
          git add client/src/pages/AdminPublications.tsx client/src/pages/AdminEbooks.tsx client/src/pages/AdminTestimonials.tsx
          git diff --cached --quiet && exit 0
          git commit -m "feat: implement admin content ebook and testimonial annotations"
          git push origin HEAD:feat-admin-content-ebooks-testimonials
