name: Limpeza interna segura de branding

on:
  push:
    paths:
      - "scripts/rename-branding-safe-internal.mjs"
      - ".github/workflows/branding-safe-internal.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar limpeza
        run: node scripts/rename-branding-safe-internal.mjs
      - name: Commitar alterações
        run: |
          if git diff --quiet; then
            echo "Nenhuma alteração pendente."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/components/PublicSocialProofToast.tsx client/src/pages/AdminToast.tsx server/storage.local.test.ts e2e/package.json
          git commit -m "refactor: clean remaining safe branding identifiers"
          git push origin HEAD:main
