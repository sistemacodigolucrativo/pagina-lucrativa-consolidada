name: Corrigir typecheck sidebar mobile
on:
  push:
    paths:
      - "scripts/fix-sidebar-mobile-typecheck.mjs"
      - ".github/workflows/fix-sidebar-mobile-typecheck.yml"
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar correção
        run: node scripts/fix-sidebar-mobile-typecheck.mjs
      - name: Commitar correção
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/components/DashboardLayout.tsx
          git commit -m "fix: correct mobile sidebar toggle type"
          git push origin HEAD:main
