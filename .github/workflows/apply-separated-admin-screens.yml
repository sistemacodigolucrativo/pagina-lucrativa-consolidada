name: Aplicar e validar telas administrativas separadas

on:
  push:
    branches: [feat-admin-separated-content-screens]
    paths:
      - .github/workflows/apply-separated-admin-screens.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat-admin-separated-content-screens
          fetch-depth: 0
      - name: Aplicar alterações cirúrgicas
        run: python3 scripts/apply-separated-admin-screens.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ativar pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.4.1 --activate
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm check
      - name: Testes
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Commitar implementação validada
        shell: bash
        run: |
          git config user.name "sistemacodigolucrativo"
          git config user.email "sistemacodigolucrativo@gmail.com"
          git add client/src/App.tsx client/src/pages/AdminEbooks.tsx client/src/pages/AdminPublications.tsx client/src/pages/AdminTestimonials.tsx server/adminSeparatedScreens.responsive.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "feat: separate ebook and testimonial admin screens"
          git push origin HEAD:feat-admin-separated-content-screens
