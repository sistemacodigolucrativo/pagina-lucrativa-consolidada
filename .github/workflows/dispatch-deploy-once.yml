name: Disparar deploy revisado uma vez

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dispatch-deploy-once.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar workflow de produção existente
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-vps.yml --ref main -f ref=main
