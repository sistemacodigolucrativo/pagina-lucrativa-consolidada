name: Validar visualmente telas administrativas

on:
  push:
    branches: [feat-admin-separated-content-screens]
    paths:
      - .github/workflows/validate-admin-visual.yml

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat-admin-separated-content-screens
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ativar pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.4.1 --activate
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile
      - name: Instalar Playwright temporariamente
        run: |
          pnpm add -D playwright@1.55.0 --ignore-workspace-root-check
          pnpm exec playwright install --with-deps chromium
      - name: Gerar build
        run: pnpm build
      - name: Iniciar aplicação local
        shell: bash
        run: |
          JWT_SECRET=admin-visual-validation-secret PORT=4173 NODE_ENV=production node dist/index.js > /tmp/admin-visual-server.log 2>&1 &
          echo $! > /tmp/admin-visual-server.pid
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/admin-visual-server.log
          exit 1
      - name: Validar Mobile Tablet e Desktop
        run: node scripts/validate-admin-visual.mjs
      - name: Exibir log da aplicação
        if: always()
        run: cat /tmp/admin-visual-server.log || true
      - name: Salvar capturas para auditoria
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-visual-validation
          path: visual-artifacts/*.png
          if-no-files-found: warn

# Reexecução após alinhar as asserções aos rótulos realmente renderizados.
