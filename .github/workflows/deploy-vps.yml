name: Validar e publicar na VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch ou commit para publicar"
        required: false
        default: "main"
      deployed_sha:
        description: "SHA completa da release ativa, conferida pelo operador"
        required: true
        type: string

concurrency:
  group: pagina-lucrativa-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validar projeto
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.sha }}
      - name: Fixar SHA validada
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Bloquear alterações automáticas de banco
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'push' && github.event.before || inputs.deployed_sha }}
          TARGET_SHA: ${{ steps.revision.outputs.sha }}
        run: bash scripts/check-schema-range.sh "$BASE_SHA" "$TARGET_SHA"
      - name: Bloquear chaves privadas versionadas
        shell: bash
        run: |
          set +e
          git grep -Il -E '^-----BEGIN (RSA |EC |DSA |OPENSSH |ENCRYPTED )?PRIVATE KEY-----' -- .
          RESULT=$?
          set -e
          if [ "$RESULT" -ne 1 ]; then
            echo 'Chave privada detectada ou inspeção incompleta; publicação bloqueada.' >&2
            exit 1
          fi
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ativar pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.4.1 --activate
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile
      - name: Validar conteúdo empacotado sem banco
        run: node scripts/sync-packaged-content.mjs --validate-only
      - name: Typecheck
        run: pnpm check
      - name: Testes
        run: pnpm test
      - name: Build
        run: pnpm build

  deploy:
    name: Publicar release na VPS
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TARGET_SHA: ${{ needs.validate.outputs.sha }}
    steps:
      - name: Verificar configuração da VPS
        id: config
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          PORT="${VPS_PORT:-22}"
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ] || [ -z "$VPS_SSH_KEY" ] || [ -z "$VPS_DEPLOY_PATH" ] || [ -z "$VPS_KNOWN_HOSTS" ]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Secrets da VPS ainda não configurados. Produção não será alterada.'
            exit 0
          fi
          echo 'ready=true' >> "$GITHUB_OUTPUT"
          echo "port=$PORT" >> "$GITHUB_OUTPUT"

      - name: Checkout do SHA validado
        if: steps.config.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.sha }}

      - name: Preparar SSH
        if: steps.config.outputs.ready == 'true'
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          umask 077
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Empacotar release validado
        if: steps.config.outputs.ready == 'true'
        run: |
          tar \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='dist' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='*.pem' \
            --exclude='*.key' \
            --exclude='backups' \
            --exclude='.local-audit' \
            -czf "/tmp/pagina-lucrativa-${TARGET_SHA}.tar.gz" .

      - name: Liberar espaço na VPS
        if: steps.config.outputs.ready == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ steps.config.outputs.port }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            "bash -s -- '$VPS_DEPLOY_PATH'" <<'REMOTE'
          set -Eeuo pipefail
          DEPLOY_ROOT="$1"

          find /tmp -maxdepth 1 -mindepth 1 -user "$(id -un)" \
            \( -type d -name 'pagina-lucrativa-deploy-*' -o -type f -name 'pagina-lucrativa-*.tar.gz' \) \
            -exec rm -rf -- {} +

          RELEASES_DIR="$DEPLOY_ROOT/releases"
          CURRENT_LINK="$DEPLOY_ROOT/current"
          CURRENT_RELEASE="$(readlink -f "$CURRENT_LINK" 2>/dev/null || true)"
          PROTECTED_RELEASE="$RELEASES_DIR/20260826-unified-c68a101"

          [ -n "$CURRENT_RELEASE" ] && [ -d "$CURRENT_RELEASE" ] || {
            echo 'current não aponta para um release válido; limpeza abortada.' >&2
            exit 1
          }

          if [ -d "$RELEASES_DIR" ]; then
            mapfile -t RELEASES < <(find "$RELEASES_DIR" -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' | sort -nr | cut -d' ' -f2-)
            KEPT=0
            for RELEASE in "${RELEASES[@]}"; do
              if [ "$RELEASE" = "$CURRENT_RELEASE" ] || [ "$RELEASE" = "$PROTECTED_RELEASE" ]; then
                continue
              fi
              KEPT=$((KEPT + 1))
              if [ "$KEPT" -gt 2 ]; then
                if find "$RELEASE" -type d ! -writable -print -quit 2>/dev/null | grep -q .; then
                  echo "Aviso: release legado sem permissão de escrita foi preservado: $(basename "$RELEASE")" >&2
                  continue
                fi
                if ! rm -rf -- "$RELEASE"; then
                  echo "Aviso: a limpeza não removeu o release antigo: $(basename "$RELEASE")" >&2
                fi
              fi
            done
          fi

          AVAILABLE_KB="$(df -Pk "$DEPLOY_ROOT" | awk 'NR == 2 { print $4 }')"
          MIN_AVAILABLE_KB=1048576
          if ! [[ "$AVAILABLE_KB" =~ ^[0-9]+$ ]]; then
            echo 'Não foi possível medir o espaço livre da VPS.' >&2
            exit 1
          fi
          if [ "$AVAILABLE_KB" -lt "$MIN_AVAILABLE_KB" ]; then
            echo "Espaço livre insuficiente para um deploy seguro: ${AVAILABLE_KB} KiB disponíveis; mínimo ${MIN_AVAILABLE_KB} KiB." >&2
            exit 1
          fi
          echo "Espaço livre validado para o deploy: ${AVAILABLE_KB} KiB."
          df -h / /tmp
          REMOTE

      - name: Enviar artefato e script
        if: steps.config.outputs.ready == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ steps.config.outputs.port }}
        run: |
          REMOTE_DIR="/tmp/pagina-lucrativa-deploy-${TARGET_SHA}"
          ssh -i ~/.ssh/id_ed25519 -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" "mkdir -p '$REMOTE_DIR'"
          scp -i ~/.ssh/id_ed25519 -P "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "/tmp/pagina-lucrativa-${TARGET_SHA}.tar.gz" scripts/deploy-vps.sh \
            "$VPS_USER@$VPS_HOST:$REMOTE_DIR/"

      - name: Executar deploy atômico com rollback
        if: steps.config.outputs.ready == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ steps.config.outputs.port }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
          DEPLOY_BASE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.deployed_sha || '' }}
        run: |
          if [ -n "$DEPLOY_BASE_SHA" ] && ! [[ "$DEPLOY_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'SHA base inválida.' >&2
            exit 1
          fi
          REMOTE_DIR="/tmp/pagina-lucrativa-deploy-${TARGET_SHA}"
          ssh -i ~/.ssh/id_ed25519 -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            "chmod 700 '$REMOTE_DIR/deploy-vps.sh' && DEPLOY_BASE_SHA='$DEPLOY_BASE_SHA' '$REMOTE_DIR/deploy-vps.sh' '$TARGET_SHA' '$VPS_DEPLOY_PATH' '$REMOTE_DIR/pagina-lucrativa-${TARGET_SHA}.tar.gz' 'http://127.0.0.1:3101/api/healthz'"

      - name: Limpar temporários após deploy
        if: always() && steps.config.outputs.ready == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ steps.config.outputs.port }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            "rm -rf -- '/tmp/pagina-lucrativa-deploy-${TARGET_SHA}' '/tmp/pagina-lucrativa-${TARGET_SHA}.tar.gz'"

      - name: Informar deploy não configurado
        if: steps.config.outputs.ready != 'true'
        run: echo 'Validação concluída. Nenhuma alteração foi feita na VPS.'
