name: Validar e publicar na VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pagina-lucrativa-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validar projeto
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Bloquear alterações automáticas de banco
        shell: bash
        run: |
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            CHANGED="$(git diff --name-only HEAD^ HEAD -- drizzle drizzle.config.ts drizzle/schema.ts || true)"
            if [ -n "$CHANGED" ]; then
              printf '%s\n' "$CHANGED"
              echo 'Alteração de banco/schema detectada. Exige backup e implantação manual revisada.' >&2
              exit 1
            fi
          fi
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ativar pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.4.1 --activate
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm check
      - name: Testes
        run: pnpm test
      - name: Build
        run: pnpm build

  deploy:
    name: Publicar release na VPS
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Verificar configuração da VPS
        id: config
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          PORT="${VPS_PORT:-22}"
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ] || [ -z "$VPS_SSH_KEY" ] || [ -z "$VPS_DEPLOY_PATH" ] || [ -z "$VPS_KNOWN_HOSTS" ]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Secrets da VPS ainda não configurados. Produção não será alterada.'
            exit 0
          fi
          echo 'ready=true' >> "$GITHUB_OUTPUT"
          echo "port=$PORT" >> "$GITHUB_OUTPUT"

      - name: Checkout do SHA validado
        if: steps.config.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Preparar SSH
        if: steps.config.outputs.ready == 'true'
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          umask 077
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Empacotar release validado
        if: steps.config.outputs.ready == 'true'
        run: |
          tar \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='dist' \
            --exclude='.env' \
            --exclude='.env.*' \
            -czf "/tmp/pagina-lucrativa-${GITHUB_SHA}.tar.gz" .

      - name: Liberar espaço temporário na VPS
        if: steps.config.outputs.ready == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ steps.config.outputs.port }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            "find /tmp -maxdepth 1 -mindepth 1 \( -type d -name 'pagina-lucrativa-deploy-*' -o -type f -name 'pagina-lucrativa-*.tar.gz' \) -exec rm -rf -- {} + || true; df -h / /tmp"

      - name: Enviar artefato e script
        if: steps.config.outputs.ready == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ steps.config.outputs.port }}
        run: |
          REMOTE_DIR="/tmp/pagina-lucrativa-deploy-${GITHUB_SHA}"
          ssh -i ~/.ssh/id_ed25519 -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" "mkdir -p '$REMOTE_DIR'"
          scp -i ~/.ssh/id_ed25519 -P "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "/tmp/pagina-lucrativa-${GITHUB_SHA}.tar.gz" scripts/deploy-vps.sh \
            "$VPS_USER@$VPS_HOST:$REMOTE_DIR/"

      - name: Executar deploy atômico com rollback
        if: steps.config.outputs.ready == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ steps.config.outputs.port }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          REMOTE_DIR="/tmp/pagina-lucrativa-deploy-${TARGET_SHA}"
          ssh -i ~/.ssh/id_ed25519 -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            "chmod 700 '$REMOTE_DIR/deploy-vps.sh' && '$REMOTE_DIR/deploy-vps.sh' '$TARGET_SHA' '$VPS_DEPLOY_PATH' '$REMOTE_DIR/pagina-lucrativa-${TARGET_SHA}.tar.gz' 'http://127.0.0.1:3101/'"

      - name: Limpar temporários após deploy
        if: always() && steps.config.outputs.ready == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ steps.config.outputs.port }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            "rm -rf -- '/tmp/pagina-lucrativa-deploy-${TARGET_SHA}' '/tmp/pagina-lucrativa-${TARGET_SHA}.tar.gz' || true" || true

      - name: Informar deploy não configurado
        if: steps.config.outputs.ready != 'true'
        run: echo 'Validação concluída. Nenhuma alteração foi feita na VPS.'
