name: Validar transição do formulário de e-book

on:
  push:
    branches: [feat-admin-content-ebooks-testimonials]
    paths:
      - .github/workflows/fix-ebook-form-open.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat-admin-content-ebooks-testimonials
          fetch-depth: 0
      - name: Corrigir transição editar para novo
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('client/src/pages/AdminEbooks.tsx')
          text = p.read_text()
          old = '''  useEffect(() => {\n    if (selectedId !== null) return;\n    setForm(current => (current.usage === defaultUsage ? current : newForm(defaultUsage)));\n    setFormOpen(!isLibraryAdmin);\n  }, [defaultUsage, isLibraryAdmin, selectedId]);'''
          new = '''  useEffect(() => {\n    if (selectedId !== null) return;\n    setForm(current => (current.usage === defaultUsage ? current : newForm(defaultUsage)));\n  }, [defaultUsage, selectedId]);\n\n  useEffect(() => {\n    setFormOpen(!isLibraryAdmin);\n  }, [isLibraryAdmin]);'''
          if old not in text:
              raise SystemExit('Bloco de transição esperado não encontrado.')
          p.write_text(text.replace(old, new, 1))
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ativar pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.4.1 --activate
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm check
      - name: Testes
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Commitar correção validada
        shell: bash
        run: |
          git config user.name "sistemacodigolucrativo"
          git config user.email "sistemacodigolucrativo@gmail.com"
          git add client/src/pages/AdminEbooks.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: keep new ebook form open after editing"
          git push origin HEAD:feat-admin-content-ebooks-testimonials
