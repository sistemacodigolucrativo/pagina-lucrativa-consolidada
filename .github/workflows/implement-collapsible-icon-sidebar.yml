name: Implementar sidebar recolhível
on:
  push:
    paths:
      - "scripts/implement-collapsible-icon-sidebar.mjs"
      - ".github/workflows/implement-collapsible-icon-sidebar.yml"
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar implementação
        run: node scripts/implement-collapsible-icon-sidebar.mjs
      - name: Commitar implementação
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/components/DashboardLayout.tsx
          git commit -m "feat: implement collapsible icon sidebar"
          git push origin HEAD:main
