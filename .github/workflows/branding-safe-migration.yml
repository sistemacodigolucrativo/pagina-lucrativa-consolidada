name: Migração segura de branding

on:
  push:
    paths:
      - "scripts/rename-branding-safe.mjs"
      - ".github/workflows/branding-safe-migration.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar migração segura
        run: node scripts/rename-branding-safe.mjs

      - name: Commitar alterações
        run: |
          if git diff --quiet; then
            echo "Nenhuma alteração pendente."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/pages/Home.tsx client/src/pages/MemberOperationCenter.tsx server/db.ts shared/publicSalesCopyEditor.ts e2e/tests/published-site.spec.ts README.md ROOT_URL_MIGRATION.md architecture.md auditoria_final_rotas_2026.md docs e2e/README.md inventario_menu_escritorio_virtual.md todo.md visual-review-notes.md
          git commit -m "refactor: migrate active branding to Código Lucrativo"
          git push origin HEAD:main
