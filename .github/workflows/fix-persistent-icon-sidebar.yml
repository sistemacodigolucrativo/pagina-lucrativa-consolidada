name: Corrigir sidebar persistente por icones
on:
  push:
    paths:
      - ".github/workflows/fix-persistent-icon-sidebar.yml"
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar correção cirúrgica
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          dashboard_path = Path('client/src/components/DashboardLayout.tsx')
          s = dashboard_path.read_text()

          replacements = [
            ('  SidebarProvider,\n  SidebarTrigger,\n  useSidebar,', '  SidebarProvider,\n  useSidebar,'),
            ('import { useIsMobile } from "@/hooks/useMobile";\n', ''),
            ('  const { state, toggleSidebar, openMobile, setOpenMobile } = useSidebar();', '  const { state, setOpen } = useSidebar();'),
            ('  const isMobile = useIsMobile();\n  const lastTouchRef = useRef(0);\n', ''),
            ('''  const handleSidebarDoubleInteraction = () => {\n    if (isMobile) {\n      setOpenMobile(!openMobile);\n      return;\n    }\n    toggleSidebar();\n  };\n\n  const handleSidebarTouchEnd = (event: React.TouchEvent<HTMLDivElement>) => {\n    const target = event.target as HTMLElement;\n    if (target.closest("button, a, [role='menuitem'], [data-sidebar='menu-button']")) return;\n    const now = Date.now();\n    if (now - lastTouchRef.current <= 350) {\n      event.preventDefault();\n      handleSidebarDoubleInteraction();\n      lastTouchRef.current = 0;\n      return;\n    }\n    lastTouchRef.current = now;\n  };\n\n''', ''),
            ('''      <div\n        className="relative"\n        ref={sidebarRef}\n        onDoubleClick={event => {\n          const target = event.target as HTMLElement;\n          if (target.closest("button, a, [role='menuitem'], [data-sidebar='menu-button']")) return;\n          handleSidebarDoubleInteraction();\n        }}\n        onTouchEnd={handleSidebarTouchEnd}\n        aria-label="Navegação lateral: toque duas vezes em uma área livre para expandir ou recolher"\n      >''', '''      <div className="relative" ref={sidebarRef}>'''),
            ('          collapsible="icon"\n          className="border-r-0 transition-[width] duration-200 ease-out"', '          collapsible="icon"\n          persistentOnMobile\n          className="border-r-0 transition-[width] duration-200 ease-out"'),
            ('''              <button\n                onDoubleClick={event => {\n                  event.stopPropagation();\n                  handleSidebarDoubleInteraction();\n                }}\n                onClick={event => event.stopPropagation()}\n                className="h-8 w-8 flex items-center justify-center hover:bg-accent rounded-lg transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-ring shrink-0"\n                aria-label="Expandir ou recolher navegação com duplo clique"\n                title="Duplo clique para expandir ou recolher"\n              >''', '''              <button\n                type="button"\n                onClick={() => setOpen(isCollapsed)}\n                className="h-9 w-9 flex items-center justify-center hover:bg-accent rounded-lg transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-ring shrink-0"\n                aria-label={isCollapsed ? "Expandir menu" : "Recolher menu"}\n                title={isCollapsed ? "Expandir menu" : "Recolher menu"}\n              >'''),
            ('          className={`absolute top-0 right-0 w-1 h-full cursor-col-resize hover:bg-primary/20 transition-colors ${isCollapsed ? "hidden" : ""}`}', '          className={`absolute top-0 right-0 hidden w-1 h-full cursor-col-resize hover:bg-primary/20 transition-colors md:block ${isCollapsed ? "md:hidden" : ""}`}'),
          ]

          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Dashboard pattern not found:\n{old[:180]}')
              s = s.replace(old, new, 1)

          mobile_block = '''        {isMobile && (\n          <div className="flex border-b h-14 items-center justify-between bg-background/95 px-2 backdrop-blur supports-[backdrop-filter]:backdrop-blur sticky top-0 z-40">\n            <div className="flex items-center gap-2">\n              <SidebarTrigger className="h-9 w-9 rounded-lg bg-background" />\n              <div className="flex items-center gap-3">\n                <div className="flex flex-col gap-1">\n                  <span className="tracking-tight text-foreground">\n                    {activeMenuItem?.label ?? "Menu"}\n                  </span>\n                </div>\n              </div>\n            </div>\n          </div>\n        )}\n'''
          if mobile_block not in s:
              raise SystemExit('Mobile duplicate trigger block not found')
          s = s.replace(mobile_block, '', 1)

          # activeMenuItem is only needed by the removed duplicate mobile header.
          active_line = '  const activeMenuItem = menuItems.find(item => isNavigationItemActive(item.path, activePath));\n'
          if active_line not in s:
              raise SystemExit('activeMenuItem line not found')
          s = s.replace(active_line, '', 1)

          dashboard_path.write_text(s)

          sidebar_path = Path('client/src/components/ui/sidebar.tsx')
          u = sidebar_path.read_text()

          old_sig = '''function Sidebar({\n  side = "left",\n  variant = "sidebar",\n  collapsible = "offcanvas",\n  disableTransition = false,\n  className,\n  children,\n  ...props\n}: React.ComponentProps<"div"> & {\n  side?: "left" | "right";\n  variant?: "sidebar" | "floating" | "inset";\n  collapsible?: "offcanvas" | "icon" | "none";\n  disableTransition?: boolean;\n}) {'''
          new_sig = '''function Sidebar({\n  side = "left",\n  variant = "sidebar",\n  collapsible = "offcanvas",\n  disableTransition = false,\n  persistentOnMobile = false,\n  className,\n  children,\n  ...props\n}: React.ComponentProps<"div"> & {\n  side?: "left" | "right";\n  variant?: "sidebar" | "floating" | "inset";\n  collapsible?: "offcanvas" | "icon" | "none";\n  disableTransition?: boolean;\n  persistentOnMobile?: boolean;\n}) {'''
          if old_sig not in u:
              raise SystemExit('Sidebar signature pattern not found')
          u = u.replace(old_sig, new_sig, 1)

          if '  if (isMobile) {' not in u:
              raise SystemExit('Mobile Sheet condition not found')
          u = u.replace('  if (isMobile) {', '  if (isMobile && !persistentOnMobile) {', 1)

          old_wrapper = '      className="group peer text-sidebar-foreground hidden md:block"'
          new_wrapper = '      className={cn("group peer text-sidebar-foreground", persistentOnMobile && isMobile ? "block" : "hidden md:block")}'
          if old_wrapper not in u:
              raise SystemExit('Sidebar wrapper class not found')
          u = u.replace(old_wrapper, new_wrapper, 1)

          old_gap = '''        className={cn(\n          "relative w-(--sidebar-width) bg-transparent",\n          disableTransition'''
          new_gap = '''        className={cn(\n          persistentOnMobile && isMobile\n            ? "relative w-(--sidebar-width-icon) shrink-0 bg-transparent"\n            : "relative w-(--sidebar-width) bg-transparent",\n          disableTransition'''
          if old_gap not in u:
              raise SystemExit('Sidebar gap class not found')
          u = u.replace(old_gap, new_gap, 1)

          old_container = '''          "fixed inset-y-0 z-10 hidden h-svh w-(--sidebar-width) md:flex",'''
          new_container = '''          "fixed inset-y-0 z-10 h-svh w-(--sidebar-width)",\n          persistentOnMobile && isMobile ? "flex" : "hidden md:flex",'''
          if old_container not in u:
              raise SystemExit('Sidebar container class not found')
          u = u.replace(old_container, new_container, 1)

          sidebar_path.write_text(u)
          PY

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile
      - name: Validar TypeScript
        run: pnpm check
      - name: Remover workflow temporario e commitar
        shell: bash
        run: |
          git rm .github/workflows/fix-persistent-icon-sidebar.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/components/DashboardLayout.tsx client/src/components/ui/sidebar.tsx
          git commit -m "fix: make panel sidebar a persistent icon rail"
          git push origin HEAD:main
