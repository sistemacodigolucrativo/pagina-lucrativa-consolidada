name: Validar cards slim de agradecimentos

on:
  push:
    branches: [fix-testimonial-slim-status-cards]
    paths:
      - client/src/pages/AdminTestimonials.tsx
      - server/adminContentEbooksTestimonials.responsive.test.ts
      - .github/workflows/validate-slim-testimonials.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-testimonial-slim-status-cards

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Preparar projeto
        run: |
          corepack enable
          corepack prepare pnpm@10.4.1 --activate
          pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Testes
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Instalar navegador temporário
        run: |
          pnpm add -D playwright@1.55.0 --ignore-workspace-root-check
          pnpm exec playwright install chromium

      - name: Iniciar aplicação local
        shell: bash
        run: |
          JWT_SECRET=slim-testimonials-validation-secret PORT=4175 NODE_ENV=production node dist/index.js > /tmp/slim-testimonials-server.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4175/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/slim-testimonials-server.log
          exit 1

      - name: Criar validação visual e funcional
        shell: bash
        run: |
          cat > scripts/validate-slim-testimonials.mjs <<'JS'
          import { chromium } from "playwright";
          import { mkdir } from "node:fs/promises";

          const baseURL = "http://127.0.0.1:4175";
          const now = new Date().toISOString();
          const adminUser = { id: 1, openId: "local_demo_admin", name: "Administrador Código Lucrativo", email: "administrador@pagina-lucrativa.local", passwordHash: null, loginMethod: "local_demo", role: "admin", createdAt: now, updatedAt: now, lastSignedIn: now };
          const longText = status => `Agradecimento longo de validação para ${status}. Este conteúdo deve permanecer oculto enquanto o card estiver no modo super slim e aparecer integralmente somente depois que o administrador expandir o card.`;
          const testimonials = [
            { id: 901, userId: 1, memberName: "Membro em análise", memberEmail: "analise@example.com", content: longText("em análise"), rating: 5, status: "pending", adminNote: "Nota pendente", createdAt: now, updatedAt: now },
            { id: 902, userId: 2, memberName: "Membro aprovado", memberEmail: "aprovado@example.com", content: longText("aprovado"), rating: 5, status: "approved", adminNote: "Nota aprovada", createdAt: now, updatedAt: now },
            { id: 903, userId: 3, memberName: "Membro em ajuste", memberEmail: "ajuste@example.com", content: longText("necessita ajuste"), rating: 4, status: "rejected", adminNote: "Nota de ajuste", createdAt: now, updatedAt: now },
            { id: 904, userId: 4, memberName: "Membro arquivado", memberEmail: "arquivado@example.com", content: longText("arquivado"), rating: 4, status: "archived", adminNote: "Nota arquivada", createdAt: now, updatedAt: now },
          ];
          const routes = [
            { path: "/admin/relatos/em-analise", status: "pending", id: 901 },
            { path: "/admin/relatos/aprovados", status: "approved", id: 902 },
            { path: "/admin/relatos/necessita-ajuste", status: "rejected", id: 903 },
            { path: "/admin/relatos/arquivados", status: "archived", id: 904 },
          ];
          const viewports = [
            { name: "mobile", width: 390, height: 844 },
            { name: "tablet", width: 768, height: 1024 },
            { name: "desktop", width: 1440, height: 900 },
          ];
          const success = data => ({ result: { data: { json: data } } });

          await mkdir("slim-testimonial-artifacts", { recursive: true });
          const browser = await chromium.launch({ headless: true });
          const errors = [];

          for (const viewport of viewports) {
            const context = await browser.newContext({ viewport: { width: viewport.width, height: viewport.height } });
            const page = await context.newPage();
            page.setDefaultTimeout(7000);
            await page.route("**/api/trpc/**", async route => {
              const request = route.request();
              const url = new URL(request.url());
              const raw = url.pathname.split("/api/trpc/")[1] ?? "";
              const procedures = raw.split(",").filter(Boolean);
              const results = procedures.map(procedure => {
                if (procedure === "auth.me") return success(adminUser);
                if (procedure === "admin.testimonials") return success(testimonials);
                return success(null);
              });
              await route.fulfill({ status: 200, contentType: "application/json", body: JSON.stringify(results) });
            });

            for (const target of routes) {
              try {
                await page.goto(`${baseURL}${target.path}`, { waitUntil: "domcontentloaded", timeout: 10000 });
                const article = page.locator("#testimonial-moderation-list article").first();
                await article.waitFor({ state: "visible" });
                const toggle = article.locator(`button[aria-controls="testimonial-moderation-details-${target.id}"]`);
                await toggle.waitFor({ state: "visible" });
                if ((await toggle.getAttribute("aria-expanded")) !== "false") throw new Error("card não iniciou recolhido");
                const collapsedBox = await toggle.boundingBox();
                if (!collapsedBox || collapsedBox.height > 64) throw new Error(`card recolhido não está super slim: ${collapsedBox?.height ?? "sem medida"}px`);
                if (await article.getByText("Nota privada para o membro", { exact: true }).isVisible().catch(() => false)) throw new Error("ações administrativas ficaram visíveis no modo slim");
                const record = testimonials.find(item => item.id === target.id);
                if (!record) throw new Error("registro de validação ausente");
                if (await article.getByText(record.content, { exact: true }).isVisible().catch(() => false)) throw new Error("conteúdo completo ficou visível no modo slim");

                await toggle.click();
                if ((await toggle.getAttribute("aria-expanded")) !== "true") throw new Error("card não expandiu");
                await article.getByText("Nota privada para o membro", { exact: true }).waitFor({ state: "visible" });
                await article.getByText(record.content, { exact: true }).waitFor({ state: "visible" });
                if (!(await article.getByText("Status", { exact: true }).isVisible())) throw new Error("status não apareceu ao expandir");
                if (!(await article.getByRole("button", { name: /Salvar nota/i }).isVisible())) throw new Error("salvar não apareceu ao expandir");
                if (!(await article.getByRole("button", { name: /Excluir/i }).isVisible())) throw new Error("excluir não apareceu ao expandir");
                const dimensions = await page.evaluate(() => ({ viewport: innerWidth, documentWidth: document.documentElement.scrollWidth, bodyWidth: document.body.scrollWidth }));
                if (Math.max(dimensions.documentWidth, dimensions.bodyWidth) > dimensions.viewport + 1) throw new Error("overflow horizontal ao expandir");
                await page.screenshot({ path: `slim-testimonial-artifacts/${viewport.name}-${target.status}-expanded.png`, fullPage: true });

                await toggle.click();
                if ((await toggle.getAttribute("aria-expanded")) !== "false") throw new Error("card não recolheu");
                if (await article.getByText("Nota privada para o membro", { exact: true }).isVisible().catch(() => false)) throw new Error("ações continuaram visíveis após recolher");
              } catch (error) {
                const message = error instanceof Error ? error.message : String(error);
                errors.push(`${viewport.name}/${target.status}: ${message}`);
                await page.screenshot({ path: `slim-testimonial-artifacts/${viewport.name}-${target.status}-failure.png`, fullPage: true }).catch(() => {});
              }
            }
            await context.close();
          }

          await browser.close();
          if (errors.length) {
            console.error(errors.join("\n"));
            process.exit(1);
          }
          console.log("Cards super slim e expansíveis validados nos quatro status em Mobile, Tablet e Desktop.");
          JS

      - name: Validar Mobile Tablet e Desktop
        run: node scripts/validate-slim-testimonials.mjs

      - name: Exibir log da aplicação
        if: always()
        run: cat /tmp/slim-testimonials-server.log || true

      - name: Salvar evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slim-testimonial-validation
          path: slim-testimonial-artifacts/*.png
          if-no-files-found: warn
