name: Validar raiz compartilhada do reset do Hero

on:
  push:
    branches: [fix-hero-reset-shared-deploy-root]
    paths:
      - .github/workflows/fix-hero-reset-root.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-hero-reset-shared-deploy-root
          fetch-depth: 0
      - name: Aplicar correção da raiz compartilhada
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Trecho não encontrado em {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1))

          service = 'server/publicHeroTitleReset.ts'
          replace_once(service,
              'import { getDb } from "./db";\n',
              'import { getDb } from "./db";\nimport { LOCAL_STORAGE_DIR } from "./storage";\n')
          replace_once(service,
              'export const DEPLOY_HERO_RESET_FAILED = ".public-hero-title-reset-failed.json";\n',
              'export const DEPLOY_HERO_RESET_FAILED = ".public-hero-title-reset-failed.json";\n\nexport function publicHeroDeployResetRoot() {\n  const configuredRoot = process.env.DEPLOY_ROOT?.trim();\n  if (configuredRoot && path.isAbsolute(configuredRoot)) return configuredRoot;\n  return path.dirname(LOCAL_STORAGE_DIR);\n}\n')
          replace_once(service,
              'export async function matchesPendingPublicHeroTitleResetToken(candidate: string, root = process.cwd()) {',
              'export async function matchesPendingPublicHeroTitleResetToken(candidate: string, root = publicHeroDeployResetRoot()) {')
          replace_once(service,
              'export async function processPendingPublicHeroTitleResetForDeploy(root = process.cwd()) {',
              'export async function processPendingPublicHeroTitleResetForDeploy(root = publicHeroDeployResetRoot()) {')

          script = 'scripts/reset-public-hero-title.ts'
          replace_once(script,
              '  const root = process.cwd();\n',
              '  const root = process.env.DEPLOY_ROOT?.trim();\n  if (!root || !path.isAbsolute(root)) throw new Error("DEPLOY_ROOT absoluto é obrigatório para restaurar o Hero.");\n')

          deploy = 'scripts/deploy-vps.sh'
          replace_once(deploy,
              '"$PNPM_BIN" exec tsx scripts/reset-public-hero-title.ts\n',
              'DEPLOY_ROOT="$DEPLOY_ROOT" "$PNPM_BIN" exec tsx scripts/reset-public-hero-title.ts\n')

          test = 'server/publicHeroTitleDeploy.integration.test.ts'
          replace_once(test,
              '    expect(deploy).toContain(\'"$PNPM_BIN" exec tsx scripts/reset-public-hero-title.ts\');\n',
              '    expect(deploy).toContain(\'DEPLOY_ROOT="$DEPLOY_ROOT" "$PNPM_BIN" exec tsx scripts/reset-public-hero-title.ts\');\n')
          replace_once(test,
              '    expect(resetScript).toContain("DEPLOY_HERO_RESET_PENDING");\n',
              '    expect(resetScript).toContain("DEPLOY_HERO_RESET_PENDING");\n    expect(resetScript).toContain("process.env.DEPLOY_ROOT?.trim()");\n')
          replace_once(test,
              '    expect(resetService).toContain(\'eq(managedContent.resourceType, "hero")\');\n',
              '    expect(resetService).toContain("publicHeroDeployResetRoot");\n    expect(resetService).toContain("path.dirname(LOCAL_STORAGE_DIR)");\n    expect(resetService).toContain(\'eq(managedContent.resourceType, "hero")\');\n')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ativar pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.4.1 --activate
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm check
      - name: Testes
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Commitar correção validada
        shell: bash
        run: |
          git config user.name "sistemacodigolucrativo"
          git config user.email "sistemacodigolucrativo@gmail.com"
          git add server/publicHeroTitleReset.ts scripts/reset-public-hero-title.ts scripts/deploy-vps.sh server/publicHeroTitleDeploy.integration.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix: share deploy root for hero reset handshake"
          git push origin HEAD:fix-hero-reset-shared-deploy-root
